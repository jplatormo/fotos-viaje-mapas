echa":"2025-08-15T11:17:59.000Z","miniatura":"fotos/g0-184.jpg"},{"lat":55.94907499999999,"lon":-3.2003166666666667,"nombre":"IMG_4763.HEIC","fecha":"2025-08-15T11:18:09.000Z","miniatura":"fotos/g0-185.jpg"},{"lat":55.94907499999999,"lon":-3.2003166666666667,"nombre":"IMG_4764.HEIC","fecha":"2025-08-15T11:18:11.000Z","miniatura":"fotos/g0-186.jpg"},{"lat":55.949077777777774,"lon":-3.2007611111111114,"nombre":"IMG_4765.HEIC","fecha":"2025-08-15T11:19:11.000Z","miniatura":"fotos/g0-187.jpg"},{"lat":55.94880277777777,"lon":-3.2001444444444447,"nombre":"IMG_4766.HEIC","fecha":"2025-08-15T11:45:54.000Z","miniatura":"fotos/g0-188.jpg"},{"lat":55.94881944444444,"lon":-3.2002472222222225,"nombre":"IMG_4767.HEIC","fecha":"2025-08-15T11:46:14.000Z","miniatura":"fotos/g0-189.jpg"},{"lat":55.94823333333333,"lon":-3.199688888888889,"nombre":"IMG_4768.HEIC","fecha":"2025-08-15T11:52:25.000Z","miniatura":"fotos/g0-190.jpg"},{"lat":55.94824722222222,"lon":-3.199705555555555,"nombre":"IMG_4769.HEIC","fecha":"2025-08-15T11:52:35.000Z","miniatura":"fotos/g0-191.jpg"},{"lat":55.95640277777778,"lon":-3.189033333333333,"nombre":"IMG_4770.HEIC","fecha":"2025-08-15T16:09:29.000Z","miniatura":"fotos/g0-192.jpg"},{"lat":55.95656666666667,"lon":-3.1876583333333333,"nombre":"IMG_4771.HEIC","fecha":"2025-08-15T16:29:38.000Z","miniatura":"fotos/g0-193.jpg"}]},{"pistaGps":null,"ruta":[]}];
    const PALETA = ['#2c6e49', '#d9822b', '#3a6ea5', '#b0413e', '#7d5ba6', '#4c956c', '#c1666b', '#2f6690', '#e07a5f', '#6a994e'];
    const mapa = L.map('mapa').setView([40.0, -3.7], 5);
    // OJO con el mapa base: NO se usan las tiles de tile.openstreetmap.org
    // directamente, porque esos servidores voluntarios prohiben expresamente
    // "distribuir una app que use sus tiles" (justo este caso: un archivo
    // que se comparte y abre gente distinta) y bloquean con 403. Tampoco se
    // usan las de CARTO: ahora piden API key incluso para uso basico.
    //
    // Con API key de Thunderforest configurada (Configuracion de la app), se
    // usa su capa "Outdoors": la unica que da nombres de picos y alturas con
    // el mismo nivel de detalle que el mapa OSM de dentro de la app, y que
    // permite explicitamente este uso (app que se comparte). Sin key, se cae
    // a la capa topografica de Esri (con curvas de nivel, pero sin nombres
    // de picos), que es gratuita y no necesita registro.
    const THUNDERFOREST_KEY = "fecc2c59ce3c468da685c950e4e6f201";
    if (THUNDERFOREST_KEY) {
      L.tileLayer('https://{s}.tile.thunderforest.com/outdoors/{z}/{x}/{y}.png?apikey=' + THUNDERFOREST_KEY, {
        attribution:
          'Mapas &copy; <a href="https://www.thunderforest.com/">Thunderforest</a>, datos ' +
          '&copy; <a href="https://www.openstreetmap.org/copyright">colaboradores de OpenStreetMap</a>',
        maxZoom: 22
      }).addTo(mapa);
    } else {
      L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',
        {
          attribution:
            'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, HERE, Garmin, USGS, Intermap, INCREMENT P, ' +
            'NRCan, Esri Japan, METI, Esri China (Hong Kong), Esri (Thailand), MapmyIndia, NGCC, (c) OpenStreetMap contributors',
          maxZoom: 19
        }
      ).addTo(mapa);
    }

    const todosPuntos = [];
    GRUPOS.forEach((grupo, indice) => {
      const color = PALETA[indice % PALETA.length];
      const tienePistaReal = grupo.pistaGps && grupo.pistaGps.length > 1;
      if (tienePistaReal) {
        const coordenadasPista = grupo.pistaGps.map((p) => [p.lat, p.lon]);
        L.polyline(coordenadasPista, { color: '#ffffff', weight: 7, opacity: 0.9 }).addTo(mapa);
        L.polyline(coordenadasPista, { color: '#e63946', weight: 4, opacity: 0.95 }).addTo(mapa);
      }
      (grupo.ruta || []).forEach((punto) => {
        todosPuntos.push([punto.lat, punto.lon]);
        const contenidoPopup = punto.miniatura
          ? '<img src="' + punto.miniatura + '" class="popup-foto-img" />'
          : '<div class="popup-foto-sin-miniatura">(sin miniatura)</div>';
        // Radio mas grande de lo que pediria solo la estetica: en movil, un
        // circulo de 5px es casi imposible de pulsar con el dedo. 10px de
        // radio (mas el borde blanco, que suma area visual y de toque) es un
        // objetivo tactil razonable sin llegar a tapar el mapa.
        const marcador = L.circleMarker([punto.lat, punto.lon], {
          radius: 10, color: '#ffffff', weight: 2, fillColor: color, fillOpacity: 0.95
        }).bindPopup(
          '<div>' + contenidoPopup + '<div>' + punto.nombre + '<br>' +
          new Date(punto.fecha).toLocaleString('es-ES') + '</div></div>',
          { maxWidth: 360, minWidth: 220 }
        );
        marcador.addTo(mapa);
      });
      if (!tienePistaReal && grupo.ruta && grupo.ruta.length > 1) {
        L.polyline(grupo.ruta.map((p) => [p.lat, p.lon]), { color, weight: 3, opacity: 0.7 }).addTo(mapa);
      }
    });
    if (todosPuntos.length > 0) mapa.fitBounds(todosPuntos, { padding: [30, 30] });
  }
